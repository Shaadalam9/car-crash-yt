[project]
name = "car-crash-yt"
version = "0.1.0"
description = "Resumable YouTube car crash compilation segmentation pipeline"
readme = "README.md"
requires-python = "==3.12.13"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "kaleido==0.2.1",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "plotly<7",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pycountry==26.2.16",
    "pytubefix>=10.11.0",
    "scikit-learn>=1.9.0",
    "torch==2.13.0",
    "torchcodec>=0.15.0",
    "torchvision==0.28.0",
    "transformers>=5.13.1",
    "yt-dlp[default]>=2026.7.4",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
